<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tour Archive — Vintage golf, sourced by tournament</title>
    <meta
      name="description"
      content="Vintage and thrifted golf apparel catalogued by the championship it belongs to. One of one, every piece."
    />
    <!-- The intro plate decision and the landing's first plate: the landing
         rotates stock photography now (src/pages/home.js), and its first
         slide ships in the prerendered document with fetchpriority="high",
         so there is no fixed plate to preload here. -->
    <script>
      /* The intro plate (the wordmark drawing itself) shows once per tab
         session and never for: reduced motion, automation (the gates measure
         the page, not the curtain), or a URL a probe stamped. Decided here,
         before first paint, so the page neither flashes nor waits on JS. */
      (function () {
        var skip = false;
        try { skip = sessionStorage.getItem('ta-intro') === '1'; } catch (e) {}
        if (!skip && window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) skip = true;
        if (!skip && navigator.webdriver) skip = true;
        if (!skip && /[?&](ux|a11y|probe|reveal|layout|bleed)=/.test(location.search)) skip = true;
        if (skip) document.documentElement.className += ' no-intro';
      })();
    </script>
    <!-- Typefaces are served from this site (public/fonts/, declared in
         src/styles/fonts.css, licence in public/fonts/OFL.txt). The three faces
         on screen above the fold start fetching now rather than after the CSS
         parses. Each file is a variable font, so one covers every weight. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="%BASE_URL%fonts/cormorant-garamond-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="%BASE_URL%fonts/cormorant-garamond-italic-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="%BASE_URL%fonts/jost-latin.woff2" />
    <!-- The TA signature mark. Vite prefixes %BASE_URL% at build time. -->
    <link rel="icon" type="image/png" href="%BASE_URL%brand/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="%BASE_URL%brand/lockup.png?v=2" />
    <meta property="og:title" content="Tour Archive — Vintage golf, sourced by tournament" />
    <meta
      property="og:description"
      content="Vintage and thrifted golf apparel catalogued by the championship it belongs to. One of one, sold direct."
    />
    <meta property="og:type" content="website" />
    <!-- The share card: 1200x630, the lockup on the site navy, made by
         scripts/og-image.py. Absolute on purpose — the scrapers that unfurl a
         link (iMessage, X, LinkedIn, Slack) do not resolve relative image
         URLs, and the canonical origin is always https://tourarchive.us, never
         www and never Vite's base path. Per-route pages override this default
         at prerender time. Bump ?v= whenever og.jpg is regenerated. -->
    <meta property="og:image" content="https://tourarchive.us/brand/og.jpg?v=1" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tour Archive" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <!-- paper grain overlay -->
    <svg class="grain" aria-hidden="true">
      <filter id="grain-filter">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" />
        <feColorMatrix type="saturate" values="0" />
      </filter>
      <rect width="100%" height="100%" filter="url(#grain-filter)" />
    </svg>

    <div class="scroll-rail" aria-hidden="true"><span data-scroll-progress></span></div>
    <div class="cursor" data-cursor aria-hidden="true"><span data-cursor-label></span></div>

    <a class="skip-link" href="#main">Skip to content</a>

    <header data-site-header></header>
    <main id="main" data-outlet tabindex="-1"></main>
    <footer data-site-footer></footer>

    <div class="page-veil" data-veil aria-hidden="true"></div>

    <!-- Intro plate: the TA mark drawing itself, once per session. The
         clip is white on black; screen-blended over navy the black vanishes
         and only the brush survives. Decorative: hidden from the tree, no
         audio, and any click or key lifts it early. -->
    <div class="intro" data-intro aria-hidden="true">
      <video data-intro-video muted playsinline preload="none" src="%BASE_URL%brand/intro.mp4?v=2"></video>
      <p class="intro-tag">Iconic Attire</p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
