<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tour Archive — Vintage golf, sourced by tournament</title>
    <meta
      name="description"
      content="Vintage and thrifted golf apparel catalogued by the championship it belongs to. One of one, every piece."
    />
    <!-- Home route only: start hero plate 1 alongside the module/font fetches
         (the SPA renders the hero after boot, so the preload scanner never sees
         it). Path must equal HERO_BACKDROPS[0] in src/pages/home.js — audit
         pins the two together. setAttribute keeps audit's href harvest quiet.
         Sits before the fonts link so it runs at parse time. -->
    <script>
      (function () {
        var base = '%BASE_URL%';
        var p = location.pathname;
        if (p.indexOf(base) === 0) p = '/' + p.slice(base.length);
        if (p.replace(/\/+$/, '') !== '' && p !== '/') return;
        var l = document.createElement('link');
        l.setAttribute('rel', 'preload');
        l.setAttribute('as', 'image');
        l.setAttribute('fetchpriority', 'low');
        l.setAttribute('href', base + 'hero/east-lake-seventh.jpg?v=1');
        document.head.appendChild(l);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <!-- The TA signature mark. Vite prefixes %BASE_URL% at build time. -->
    <link rel="icon" type="image/png" href="%BASE_URL%brand/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="%BASE_URL%brand/lockup.png?v=2" />
    <meta property="og:title" content="Tour Archive — Vintage golf, sourced by tournament" />
    <meta
      property="og:description"
      content="Vintage and thrifted golf apparel catalogued by the championship it belongs to. First drop opens with the 2026 TOUR Championship."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%BASE_URL%brand/lockup.png?v=2" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <!-- paper grain overlay -->
    <svg class="grain" aria-hidden="true">
      <filter id="grain-filter">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" />
        <feColorMatrix type="saturate" values="0" />
      </filter>
      <rect width="100%" height="100%" filter="url(#grain-filter)" />
    </svg>

    <div class="scroll-rail" aria-hidden="true"><span data-scroll-progress></span></div>
    <div class="cursor" data-cursor aria-hidden="true"><span data-cursor-label></span></div>

    <a class="skip-link" href="#main">Skip to content</a>

    <header data-site-header></header>
    <main id="main" data-outlet tabindex="-1"></main>
    <footer data-site-footer></footer>

    <div class="page-veil" data-veil aria-hidden="true"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
