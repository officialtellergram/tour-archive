webhooks:
  newOrder:
    post:
      summary: >-
        `v1:order.new` New order webhook
      description: >-
        This webhook is sent whenever a new order is placed on Depop.

        The webhook will contain the details of the order, including the buyer's address and the items purchased.

        You can use this webhook to update your inventory and other platforms that the item is no longer available.
        
        Please make sure you're using the orders endpoint to reconcile the orders you have received via webhooks, as
        these will have a best effort delivery.
      operationId: newOrderWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Webhook'
            example:
              id: "a210923f-c1f3-4d84-a2bd-7f18c68553e2"
              event_type: "v1:order.new"
              created_at: "2025-01-01T00:00:00Z"
              data:
                seller_id: 123456
                purchase_id: "123456"
                status: "SHIPPING_PENDING"
                currency: "GBP"
                buyer_pays_amount: "50.99"
                seller_receives_amount: "45.99"
                fee_amount: "5.00"
                buyer_shipping_price: "5.00"
                buyer_address:
                  name: "John Doe"
                  address: "123 Main St"
                  address2: "Apt 1"
                  city: "London"
                  postal_code: "EC1V 4PW"
                  state: "Greater London"
                  country: "GB"
                  phone_number: "07123456789"
                line_items:
                  - purchase_item_id: 2385551
                    sku: "ABC-12345-S-BL"
                    product_id: 7021251
                    slug: "vintage-nike-t-shirt-7021251"
                    parcel_id: "6e3538ca-6653-3c25-bf0a-a2be876b17e4"
                    description: "Vintage Nike T-Shirt in excellent condition. Black with white swoosh logo on the front."
                    original_price: "29.99"
                    sold_price: "25.99"
                    sold_via_offers: false
                    image_url: "https://media-photos-staging.depop.com/b0/18220/5612584_b6795bc34778465293e45647518906d6/P0.jpg"
      responses:
        "200":
          description: Acknowledgment
  orderRefunded:
    post:
      summary: >-
        `v1:order.refund` Order refunded webhook
      description: >-
        This webhook is sent whenever an order is refunded on Depop.

        The webhook will contain the details of the refund, including who refunded (either PARTNER or DEPOP) and the purchase id for the order.
      operationId: orderRefundedWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Webhook'
            example:
              id: "a210923f-c1f3-4d84-a2bd-7f18c68553e2"
              event_type: "v1:order.refund"
              created_at: "2025-01-01T00:00:00Z"
              data:
                purchase_id: "123456"
                refunded_by: "PARTNER"
      responses:
        "200":
          description: Acknowledgment.
  productLiked:
    post:
      summary: >-
        `v1:product.like` Product liked webhook
      description: >-
        This webhook is sent whenever a user likes a product.

        You can use this webhook to track engagement with your products and identify which items are popular with buyers.
      operationId: productLikedWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Webhook'
            example:
              id: "b320934f-d2g4-5e95-b3ce-8g29d79664f3"
              event_type: "v1:product.like"
              created_at: "2025-01-01T00:00:00Z"
              data:
                seller_id: 123456
                product_id: 7021251
                sku: "ABC-12345-S-BL"
                slug: "vintage-nike-t-shirt-7021251"
                liker_id: 789012
      responses:
        "200":
          description: Acknowledgment.
  productUnliked:
    post:
      summary: >-
        `v1:product.unlike` Product unliked webhook
      description: >-
        This webhook is sent whenever a user unlikes a product.

      operationId: productUnlikedWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Webhook'
            example:
              id: "c431045g-e3h5-6f06-c4df-9h30e80775g4"
              event_type: "v1:product.unlike"
              created_at: "2025-01-01T00:00:00Z"
              data:
                seller_id: 123456
                product_id: 7021251
                sku: "ABC-12345-S-BL"
                slug: "vintage-nike-t-shirt-7021251"
                liker_id: 789012
      responses:
        "200":
          description: Acknowledgment.
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
  schemas:
    ProductCreateOrUpdateResponse:
      type: object
      required:
        - product_id
        - slug
      properties:
        product_id:
          type: number
          example: 12345678
          description: The product id of the created or updated product.
        slug:
          type: string
          example: "vintage-nike-t-shirt-12345678"
          description: >-
            The URL-friendly identifier for the product on Depop.
            This can be used with the `/api/v1/products/by-slug/{slug}/` endpoints.
        sku:
          type:
            - string
            - 'null'
          example: "ABC-12345-S-BL"
          description: >-
            The SKU of the product.

            - For PUT `/api/v1/products/by-sku/{sku}/`: Always present (same as the SKU in the URL path).
            - For PUT `/api/v1/products/by-slug/{slug}/`: Present if the product has a SKU, otherwise null.
            - For PUT `/api/v1/products/by-product-id/{productId}/`: Present if the product has a SKU, otherwise null.
            - For POST `/api/v1/products/`: Present if SKU was provided in the request, otherwise null.
      example:
        product_id: 12345678
        slug: "vintage-nike-t-shirt-12345678"
        sku: "ABC-12345-S-BL"
    ProductCreateRequest:
      type: object
      required:
        - address
        - description
        - price_currency
        - price_amount
        - quantity
        - pictures
        - department
        - product_type
        - condition
        - brand_name
      properties:
        sku:
          type: string
          description: >-
            SKU of the product. Optional - if not provided, the product will be created without a SKU.

            Must be unique. Can't be reused.

            This SKU will be used in other endpoints to reference this particular product and also in the webhooks.
          maxLength: 50
          example: ABC-12345-S-BL
        address:
          $ref: '#/components/schemas/Address'
        description:
          type: string
          description: >-
            A good description should contain key attribute information (brand, category, color, size, age etc),
            clarifying information about flaws, condition, fit, size and measurements.
            Commonly they end with hash tags (for example, \#summer).

            Constraints:
             * Limited to 1000 characters
             * Email addresses are not allowed
             * Can only have up to 5 hashtags (for example, \#summer).
          maxLength: 1000
          example: >-
            Women's Burgundy and Purple Vest

            Mauve and white striped tank top
            Small mark at the bottom of the hem

            #stripes #summer
        price_currency:
          type: string
          description: The currency code of the item's price.
          example: GBP
        price_amount:
          type: string
          description: The price of the item. Must be at least $1.00 or £1.00. Up to 2 decimal places.
          example: "50.99"
        discount_price:
          type: string
          description: >-
            The discounted price of the item. When set, the original price will be shown crossed out
            and this price will be shown as the current price.
            Up to 2 decimal places.
          example: "24.00"
        auto_send_offer_price:
          type: string
          description: >-
            The price to automatically send to buyers who liked or have bagged the product.

            There's a fixed 1h delay before an offer is sent.

            If not set, the product will not automatically send offers.

            Must be less at least 5% off the price_amount.
            Up to 2 decimal places.
          example: "45.00"
        auto_negotiate_offer_price:
          type: string
          description: >-
            The price to automatically respond with when a buyer sends an offer in this product:
             * If the buyer offer is higher or equal to this value, then the offer will be automatically accepted.
             * If the buyer offer is lower than this value, then the offer will be automatically countered with this price.

            If the buyer counters again, the same value will be used to counter the buyer's offer.

            If not set, the offers will not be automatically responded to.

            Must be less at least 5% off the price_amount or the discount_price if the discount_price is set
            Up to 2 decimal places.
          example: "45.00"
        international_shipping_cost:
          type: string
          description: The cost of shipping the product internationally. Only set this if the product can be shipped internationally. Same currency as price_currency.
          example: "5.0"
        national_shipping_cost:
          type: string
          description: >-
            The cost of shipping the product nationally. Same currency as price_currency.
            If set to 0, the product has free shipping for buyers.

            **Important:** Either `national_shipping_cost` OR `depop_shipping` must be provided.
            If using Depop managed shipping, use `depop_shipping` instead and omit this field.
          example: "2.0"
        depop_shipping:
          allOf:
            - $ref: '#/components/schemas/DepopShippingDetails'
          description: >-
            Depop managed shipping configuration. When provided, Depop will handle the shipping logistics
            and automatically calculate the national shipping cost based on the selected provider and parcel size.

            **Important:** Either `depop_shipping` OR `national_shipping_cost` must be provided (but not both).
            If you provide `depop_shipping`, the `national_shipping_cost` will be automatically derived
            from the shipping provider's pricing.
          example:
            address_id: 123456
            shipping_provider_id: "USPS"
            parcel_size_id: "SMALL"
            payer: "buyer"
        quantity:
          type: number
          description: The quantity of the product available for sale. Must be at least 1.
          example: 1
        pictures:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: '#/components/schemas/PublicPicture'
          description: >-
            Array of product images. Minimum 1 image is required, maximum 8 images allowed.
            The first image will be used as the main product image shown in search results.
          example:
            - url: "https://images.example.com/products/vintage-nike-tshirt-front.jpg"
            - url: "https://images.example.com/products/vintage-nike-tshirt-back.jpg"
            - url: "https://images.example.com/products/vintage-nike-tshirt-detail.jpg"
        department:
          type: string
          description: >-
            Top level category of the product.

            Currently we support: womenswear, menswear, kidswear and everything-else.
            These rarely change.

            For an up to date list, please make use of our taxonomy endpoint.
            Currently, in https://api.depop.com/api/v3/attributes/ under the key `department`.
          example: womenswear
        product_type:
          type: string
          description:
            The more specific category of the product.

            Note that there's an intermediate level between department and product type called "group".
            We don't need to receive this when an item is being listed but it's used in the apps/website to organize
            the product types.

            For example, in "menswear >> swim-beach-wear >> swimsuit-one-piece", we only need to know the department "menswear"
            and the product type "swimsuit-one-piece".

            For an up to date list, please make use of our taxonomy endpoint.
            Currently, in https://api.depop.com/api/v3/attributes/ under the key `group`.
          example: tshirts
        size_set_id:
          type: number
          description: >-
            The size set ID for the given Department and Product Type.

            This field is mandatory for product types that have a size set available.
          example: 2
        size_id:
          description: >-
            The size ID for a given size Set ID.

            This field is mandatory for product types that have a size set available.
          type: number
          example: 10
        condition:
          type: string
          anyOf:
            - type: string
              enum:
                - brand_new
                - used_like_new
                - used_excellent
                - used_good
                - used_fair
          example: brand_new
        colour:
          type: array
          items:
            type: string
          maxItems: 2
          description: >-
            Array of colours that apply to the product (maximum 2).

            Please refer to https://api.depop.com/api/v3/attributes/ for the full list of supported colours.
          example: [ "black", "white" ]
        style:
          type: array
          items:
            type: string
          description: >-
            Array of styles that apply to the product.

            Please refer to https://api.depop.com/api/v3/attributes/ for the full list of supported styles.
          example: [ "streetwear", "goth" ]
        age:
          type: array
          items:
            type: string
          description: >-
            Array of ages that apply to the product.

            Please refer to https://api.depop.com/api/v3/attributes/ for the full list of supported ages.
          example: [ "90s" ]
        source:
          type: array
          items:
            type: string
          description: >-
            Array of sources that apply to the product.

            Please refer to https://api.depop.com/api/v3/attributes/ for the full list of supported sources.
          example: [ "vintage" ]
        brand_name:
          type: string
          description: The brand name of the product, e.g. "Nike".
          example: Nike
        attributes:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: >-
            Additional product type-specific attributes as a map of attribute IDs to arrays of attribute values.
            Each product_type has a set of optional attributes.
            To get the full list of supported attributes, please use our taxonomy endpoint: https://api.depop.com/api/v3/attributes/
          example:
            sleeve-length: [ "short" ]
            occasion: [ "wedding" ]
        is_boosted:
          type: boolean
          description: >-
            Whether to boost the product.
            
            You don't need to send this with `true` if you have a "boosted shop" or you're part of the "free boost trial".
          example: false
