    post:
      tags:
        - Products - By Product ID
      summary: Submit an offer for a product by product ID
      description: >-
        This endpoint allows you to submit an offer on behalf of a seller to a specific buyer for a product using its internal product ID.
        The offer will be sent to the specified buyer.
        You can only send offers to buyers who have shown interest in your products (likes, bags, messages)

