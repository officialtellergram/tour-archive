openapi: 3.1.0
info:
  title: Seller API
  version: 1.0.0
  description: |-
    Externally facing API to allow enterprise partners to automate listing on Depop.

    ## OAuth 2.0 Scopes

    This API uses OAuth 2.0 scopes to control access to different resources. Each endpoint requires specific scopes to access:

    - **`products_read`** - Required to read product information and listings
    - **`products_write`** - Required to create, update, or delete products
    - **`orders_read`** - Required to read order information and order history
    - **`orders_write`** - Required to mark orders as shipped or process refunds
    - **`offers_read`** - Required to read offer pricing information (auto send offer price, auto negotiate offer price)
    - **`offers_write`** - Required to set or modify offer prices (auto send offer price, auto negotiate offer price)
    - **`shop_read`** - Required to read shop information including seller addresses and available shipping providers

    API key tokens have access to all scopes, while OAuth tokens are limited to the scopes specified in the token.

    If you attempt to access an endpoint without the required scope, you will receive a `403 Forbidden` response with the error code `insufficient_scope`.

servers:
  - url: https://partnerapi-staging.depop.com
  - url: https://partnerapi.depop.com
security:
  - BearerAuth: [ ]

paths:
  /api/v1/products/by-sku/{sku}/:
    put:
      tags:
        - Products - By SKU
      summary: Create or update a listing on Depop
      description: >-
        This endpoint allows you to create or update a new listing on Depop. The product will be available for sale immediately.

        **Required OAuth Scopes:**
        - `products_write` - Required for all product operations
        - `offers_write` - Required when setting `auto_send_offer_price` or `auto_negotiate_offer_price`

        #### Creating vs. Updating a Listing

        - **Creating a listing:** If the provided `sku` does not exist, a new product listing will be created.
        
        
        - **Updating a listing:** If the provided `sku` already exists, the existing product will be updated with the new details in the request.

        #### Taxonomy

        For more information on Depop's taxonomy, please refer to the [Concepts/Taxonomy](https://partnerapi.depop.com/api-docs/concepts/taxonomy/) documentation.

      operationId: createOrUpdateProduct
      parameters:
        - name: sku
          in: path
          description: >-
            SKU of the product. Must be unique. It can't be reused.
            
            This SKU will be used in other endpoints to reference this particular product and also in the webhooks.
          required: true
          schema:
            type: string
            maxLength: 50
          example: ABC-12345-S-BL
      requestBody:
        description: Product details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductPutRequest'
            example:
              address:
                country_code: "GB"
                state: "Greater London"
              description: "Vintage Nike T-Shirt in excellent condition.\nBlack with white swoosh logo on the front.\nSize medium, fits true to size.\nSmall mark on the left sleeve (see last image).\n\n#vintage #nike #streetwear #90s"
              price_currency: "GBP"
              price_amount: "25.99"
              discount_price: "24.00"
              auto_send_offer_price: "20.00"
              auto_negotiate_offer_price: "20.00"
              national_shipping_cost: "3.50"
              international_shipping_cost: "12.00"
              quantity: 1
              pictures:
                - url: "https://images.ctfassets.net/itoh30v6uh9a/3c1QQDGUAEHH9A76ovYSTA/1837e557daee3c763b6fbedd19785094/WW.jpg#type=cover-image"
                - url: "https://images.ctfassets.net/itoh30v6uh9a/3c1QQDGUAEHH9A76ovYSTA/1837e557daee3c763b6fbedd19785094/WW.jpg#type=back"
                - url: "https://images.ctfassets.net/itoh30v6uh9a/3c1QQDGUAEHH9A76ovYSTA/1837e557daee3c763b6fbedd19785094/WW.jpg#type=tag"
              department: "menswear"
              product_type: "tshirts"
              size_set_id: 52
              size_id: 10
              condition: "used_excellent"
              colour:
                - "black"
                - "white"
              style:
                - "streetwear"
                - "retro"
                - "sportswear"
              age:
                - "90s"
              source:
                - "vintage"
                - "preloved"
              brand_name: "Nike"
              attributes:
                sleeve-length: [ "short" ]
                material: [ "cotton" ]
                occasion: [ "casual" ]
              is_boosted: false
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCreateOrUpdateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ProductUnprocessableEntity'
    patch:
      tags:
        - Products - By SKU
      summary: Patch an existing product on Depop
      description: >-
        This endpoint allows you to patch an `ON SALE` products fields on Depop.

        If you want to restock a product, call the PUT endpoint with the same SKU with the available quantity.

        **Required OAuth Scopes:**
        - `products_write` - Required for all product operations
        - `offers_write` - Required when setting `auto_send_offer_price` or `auto_negotiate_offer_price`
      operationId: patchProduct
      parameters:
        - name: sku
          in: path
          description: SKU of the product.
          required: true
          schema:
            type: string
            maxLength: 50
          example: ABC-12345-S-BL
      requestBody:
        description: Product fields to patch on the existing product.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchProductRequest'
            example:
              price_amount: "39.99"
              discount_price: "37.00"
              auto_send_offer_price: "35.00"
              auto_negotiate_offer_price: "35.00"
        required: true
      responses:
        '200':
          description: Successful operation, no content returned.
          content: { }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags:
        - Products - By SKU
      summary: Get product details by SKU
      description: >-
        This endpoint allows you to get the details of a product by its SKU.

        **Required OAuth Scopes:**
        - `products_read` - Required to access product information
        - `offers_read` - Optional. Required to include offer pricing information (`auto_send_offer_price`, `auto_negotiate_offer_price`) in the response. If this scope is not provided, these fields will be omitted from the response.


        The SKU is the unique identifier for the product and is used in other endpoints to reference this particular product.

        The SKU will be used in the webhooks.

        Note that the SKU will _not_ be reusable.
      operationId: getProductBySku
      parameters:
        - name: sku
          in: path
          description: The SKU of the product.
          required: true
          schema:
            type: string
          example: "ABC-12345-S-BL"
      responses:
        '200':
          description: A single product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                sku: "ABC-12345-S-BL"
                product_id: 123456789
                slug: "vintage-nike-t-shirt-123456789"
                status: "STATUS_ONSALE"
                address:
                  country_code: "GB"
                  state: "Greater London"
                description: "Vintage Nike T-Shirt in excellent condition.\nBlack with white swoosh logo on the front.\nSize medium, fits true to size.\nSmall mark on the left sleeve (see last image).\n\n#vintage #nike #streetwear #90s"
                price_currency: "GBP"
                price_amount: "25.99"
                current_price: "24.00"
                discount_price: "24.00"
                auto_send_offer_price: "20.00"
                auto_negotiate_offer_price: "20.00"
                national_shipping_cost: "3.50"
                international_shipping_cost: "12.00"
                quantity: 1
                pictures:
                  - url: "https://media-photos-staging.depop.com/b0/18220/5612584_b6795bc34778465293e45647518906d6/P0.jpg"
                    height: 1280
                    width: 1280
                  - url: "https://media-photos-staging.depop.com/b0/18220/5612584_b6795bc34778465293e45647518906d6/P1.jpg"
                    height: 1280
                    width: 1280
                  - url: "https://media-photos-staging.depop.com/b0/18220/5612584_b6795bc34778465293e45647518906d6/P2.jpg"
                    height: 1280
                    width: 1280
                department: "menswear"
                product_type: "tshirts"
                size_set_id: 52
                size_id: 10
                condition: "used_excellent"
                colour:
                  - "black"
                  - "white"
                style:
                  - "streetwear"
                  - "retro"
                  - "sportswear"
                age:
                  - "90s"
                attributes:
                  sleeve-length: [ "short" ]
                  material: [ "cotton" ]
                  occasion: [ "casual" ]
                brand: "Nike"
                is_boosted: false
                source:
                  - "vintage"
                  - "preloved"
                created_at: "2024-01-15T10:30:00Z"
                updated_at: "2024-01-15T14:20:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags:
        - Products - By SKU
      summary: Delete a product on Depop
      description: >-
        This endpoint allows you to delete a product on Depop.
        The product will no longer be available for sale and will be removed from your shop.
        This endpoint is idempotent - it will return a successful response (200) even if the product doesn't exist.

        **Required OAuth Scope:** `products_write`
      operationId: deleteProduct
      parameters:
        - name: sku
          in: path
          description: SKU of the product.
          required: true
          schema:
            type: string
            maxLength: 50
          example: ABC-12345-S-BL
        - name: fail_if_active_offers
          in: query
          description: >-
            If set to `true`, the delete will fail with a 409 Conflict error if the product has any active offers.
            If set to `false` or omitted, the product will be deleted regardless of active offers.


            **Note:** This is a temporary flag until insights are available to help you manage active offers.
            If you plan to use this feature, please let us know so we can understand your use case and ensure a smooth transition
            when insights become available.
          required: false
          schema:
            type: boolean
            default: false
          example: true
      responses:
        '200':
          description: Successful operation
          content: { }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Conflict - Product has active offers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                id: "a210923f-c1f3-4d84-a2bd-7f18c68553e2"
                errors:
                  - code: "product_has_active_offers"
                    message: "Product has active offers and cannot be deleted."
  /api/v1/products/by-sku/{sku}/mark-as-sold/:
    post:
      tags:
        - Products - By SKU
      summary: Mark a product as sold
      description: >-
        This endpoint allows you to mark a product as sold on your Depop shop.
        The product will no longer be available for sale but it will still be visible in your shop with a "sold" overlay.

        **Required OAuth Scope:** `products_write`

        You're expected to call this as soon as you make a sale on a different platform.
        You don't need to call this if the product sells on Depop.

        If the product is not in a selling state, this endpoint will still return successfully but will remain in the same state.
      operationId: markProductAsSold
      parameters:
        - name: sku
          in: path
          description: SKU of the product.
          required: true
          schema:
            type: string
            maxLength: 50
          example: ABC-12345-S-BL
      responses:
        '200':
          description: Successful operation, no content returned.
          content: { }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                id: "a210923f-c1f3-4d84-a2bd-7f18c68553e2"
                errors:
                  - code: "product_not_found"
                    message: "Product (sku: womens-tshirt-1, id: 123) not found"
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/products/:
    post:
      tags:
        - Products
      summary: Create a new product
      description: >-
        This endpoint allows you to create a new product listing on Depop. The product will be available for sale immediately.


        **Required OAuth Scopes:**
        - `products_write` - Required for all product operations
        - `offers_write` - Required when setting `auto_send_offer_price` or `auto_negotiate_offer_price`


        **SKU is optional**: If you don't provide a SKU, the product will be created without one (it can be managed by product_id).
        If you provide a SKU and it already exists, the request will fail with a 400 error.

        To update an existing product, use the PUT `/api/v1/products/by-product-id/{productId}/` endpoint instead.
      operationId: createProduct
      requestBody:
        description: Product details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
            example:
              address:
                country_code: "GB"
                state: "Greater London"
              description: "Vintage Nike T-Shirt in excellent condition.\nBlack with white swoosh logo on the front.\nSize medium, fits true to size.\nSmall mark on the left sleeve (see last image).\n\n#vintage #nike #streetwear #90s"
              price_currency: "GBP"
              price_amount: "25.99"
              discount_price: "24.00"
              auto_send_offer_price: "20.00"
              auto_negotiate_offer_price: "20.00"
              national_shipping_cost: "3.50"
              international_shipping_cost: "12.00"
              quantity: 1
              pictures:
                - url: "https://images.ctfassets.net/itoh30v6uh9a/3c1QQDGUAEHH9A76ovYSTA/1837e557daee3c763b6fbedd19785094/WW.jpg#type=cover-image"
                - url: "https://images.ctfassets.net/itoh30v6uh9a/3c1QQDGUAEHH9A76ovYSTA/1837e557daee3c763b6fbedd19785094/WW.jpg#type=back"
                - url: "https://images.ctfassets.net/itoh30v6uh9a/3c1QQDGUAEHH9A76ovYSTA/1837e557daee3c763b6fbedd19785094/WW.jpg#type=tag"
              department: "menswear"
              product_type: "tshirts"
              size_set_id: 52
              size_id: 10
              condition: "used_excellent"
              colour:
                - "black"
                - "white"
              style:
                - "streetwear"
                - "retro"
                - "sportswear"
              age:
                - "90s"
              source:
                - "vintage"
                - "preloved"
              brand_name: "Nike"
              attributes:
                sleeve-length: [ "short" ]
                material: [ "cotton" ]
                occasion: [ "casual" ]
              is_boosted: false
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCreateOrUpdateResponse'
              example:
                product_id: 12345678
                slug: "vintage-nike-t-shirt-12345678"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ProductUnprocessableEntity'
    get:
      tags:
        - Products
      summary: Get all products
      description: >-
        This endpoint returns all the products you have listed on Depop with details about each product.

        **Required OAuth Scopes:**
        - `products_read` - Required to access product information
        - `offers_read` - Optional. Required to include offer pricing information (`auto_send_offer_price`, `auto_negotiate_offer_price`) in the response. If this scope is not provided, these fields will be omitted from the response.


        It can return a maximum of 100 products at a time and can be paginated using the `cursor` parameter by providing the `cursor` found in the `meta` object.


        By default the products are returned in descending order by product ID, with the latest product added shown first. Use the `sort_by` parameter to change the ordering.
      operationId: getAllProducts
      parameters:
        - name: limit
          in: query
          description: The number of products to return. Default is 20.
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 20
        - name: cursor
          in: query
          description: Request products created after this cursor.
          schema:
            type: string
        - name: sort_by
          in: query
          description: >-
            Sort order for products. `id_desc` returns products in descending order by product ID (newest first),
            `id_asc` returns products in ascending order by product ID (oldest first),
            `created_date_desc` returns products in descending order by creation date (most recently created first).
            Default is `id_desc`.
          schema:
            type: string
            enum:
              - id_desc
              - id_asc
              - created_date_desc
            default: id_desc
          example: id_desc
        - name: state
          in: query
          description: >-
            Filter products by state. `selling` returns products currently on sale,
            `sold` returns products that have been sold. When not provided, all products are returned regardless of state.
            `all` returns all products regardless of state.
          schema:
            type: string
            enum:
              - selling
              - sold
              - all
          example: selling
        - name: from_created_date
          in: query
          description: >-
            Only return products created on or after this date. Must be an ISO-8601 datetime
            (e.g. `2025-01-01T00:00:00Z`). When not provided, there is no lower bound on creation date.
          schema:
            type: string
            format: date-time
          example: "2025-01-01T00:00:00Z"
        - name: to_created_date
          in: query
          description: >-
            Only return products created on or before this date. Must be an ISO-8601 datetime
            (e.g. `2025-12-31T23:59:59Z`). When not provided, there is no upper bound on creation date.
            When both bounds are provided, `from_created_date` must be before or equal to `to_created_date`,
            otherwise the request is rejected with `422 Unprocessable Entity`.
          schema:
            type: string
            format: date-time
          example: "2025-12-31T23:59:59Z"
      responses:
        '200':
          description: >-
            This returns all the products you have listed on Depop.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      cursor:
                        type: string
                        example: "NzIwODg1MXwyMDI1LTA2LTE3VDE2OjM3OjMwLjQ0ODI0NTU1NFp8MjQw"
                      has_more:
                        type: boolean
                        example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                    example: [ ]
                example:
                  meta:
                    cursor: "NzIwODg1MXwyMDI1LTA2LTE3VDE2OjM3OjMwLjQ0ODI0NTU1NFp8MjQw"
                    has_more: false
                  data: [ ]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/products/by-product-id/{productId}/:
    get:
      tags:
        - Products - By Product ID
      summary: Get product details by product ID
      description: >-
        This endpoint allows you to get the details of a product by its internal product ID.

        **Required OAuth Scopes:**
        - `products_read` - Required to access product information
        - `offers_read` - Optional. Required to include offer pricing information (`auto_send_offer_price`, `auto_negotiate_offer_price`) in the response. If this scope is not provided, these fields will be omitted from the response.
      operationId: getProductById
      parameters:
        - name: productId
          in: path
          description: The internal product ID of the product.
          required: true
          schema:
            type: integer
            format: int64
          example: 7033001
      responses:
        '200':
          description: A single product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                product_id: 7033001
                slug: "vintage-nike-t-shirt-7033001"
                status: "STATUS_ONSALE"
                address:
                  country_code: "GB"
                  state: "Greater London"
                description: "Vintage Nike T-Shirt in excellent condition.\nBlack with white swoosh logo on the front.\nSize medium, fits true to size.\nSmall mark on the left sleeve (see last image).\n\n#vintage #nike #streetwear #90s"
                price_currency: "GBP"
                price_amount: "25.99"
                current_price: "24.00"
                discount_price: "24.00"
                auto_send_offer_price: "20.00"
                auto_negotiate_offer_price: "20.00"
                national_shipping_cost: "3.50"
                international_shipping_cost: "12.00"
                quantity: 1
                pictures:
                  - url: "https://media-photos-staging.depop.com/b0/18220/5612584_b6795bc34778465293e45647518906d6/P0.jpg"
                    height: 1280
                    width: 1280
                  - url: "https://media-photos-staging.depop.com/b0/18220/5612584_b6795bc34778465293e45647518906d6/P1.jpg"
                    height: 1280
                    width: 1280
                  - url: "https://media-photos-staging.depop.com/b0/18220/5612584_b6795bc34778465293e45647518906d6/P2.jpg"
                    height: 1280
                    width: 1280
                department: "menswear"
                product_type: "tshirts"
                size_set_id: 52
                size_id: 10
                condition: "used_excellent"
                colour:
                  - "black"
                  - "white"
                style:
                  - "streetwear"
                  - "retro"
                  - "sportswear"
                age:
                  - "90s"
                attributes:
                  sleeve-length: [ "short" ]
                  material: [ "cotton" ]
                  occasion: [ "casual" ]
                brand: "nike"
                is_boosted: false
                source:
                  - "vintage"
                  - "preloved"
                created_at: "2024-01-15T10:30:00Z"
                updated_at: "2024-01-15T14:20:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                id: "a210923f-c1f3-4d84-a2bd-7f18c68553e2"
                errors:
                  - code: "product_not_found"
                    message: "Product (id: 7033001) not found"
    put:
      tags:
        - Products - By Product ID
      summary: Update an existing product by product ID
      description: >-
        This endpoint allows you to update an existing product on Depop using its internal product ID.
        The product will be updated with the new details in the request.

        **Required OAuth Scopes:**
        - `products_write` - Required for all product operations
        - `offers_write` - Required when setting `auto_send_offer_price` or `auto_negotiate_offer_price`

        **Note:** This endpoint only supports updating existing products. If the product ID does not exist, a 404 error will be returned.
        To create a new product, use the POST `/api/v1/products/` endpoint instead.
      operationId: updateProductById
      parameters:
        - name: productId
          in: path
          description: >-
            The internal product ID of the product to update.
          required: true
          schema:
            type: integer
            format: int64
          example: 7033001
      requestBody:
        description: Product details to update
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductPutRequest'
            example:
              address:
                country_code: "GB"
                state: "Greater London"
              description: "Vintage Nike T-Shirt in excellent condition.\nBlack with white swoosh logo on the front.\nSize medium, fits true to size.\nSmall mark on the left sleeve (see last image).\n\n#vintage #nike #streetwear #90s"
              price_currency: "GBP"
              price_amount: "25.99"
              discount_price: "24.00"
              auto_send_offer_price: "20.00"
              auto_negotiate_offer_price: "20.00"
              national_shipping_cost: "3.50"
              international_shipping_cost: "12.00"
              quantity: 1
              pictures:
