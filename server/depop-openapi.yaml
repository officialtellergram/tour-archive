  /api/v1/pricing/inspiration/:
    post:
      tags:
        - Pricing Inspiration
      summary: Get pricing inspiration when given product listing details
      description: >-
        This endpoint returns a price prediction range and a list of similar sold items for a product listing.

        The price prediction is the core of the response. The list of similar sold items is supplementary
        and best-effort: if the similar sold items lookup is unavailable (for example, a timeout), the
        endpoint still returns the price prediction with an empty `similar_sold_items` array rather than
        failing. Clients should therefore not rely on `similar_sold_items` always being populated.

        This endpoint does not require OAuth Scopes and is only valid for specific countries (US and GB).
      operationId: getPricingInspiration
      requestBody:
        description: Pricing inspiration request body
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricingInspirationRequest'
        required: true
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingInspirationResponse'
              example:
                price_prediction:
                  lower_bound: '17.00'
                  balanced: '19.00'
                  prediction: '19.00'
                  upper_bound: '22.00'
                similar_sold_items:
                  - brand_name: Nike
                    condition: used_excellent
                    picture:
                      height: 1280
                      url: https://media-photos-staging.depop.com/b0/18220/5612584_b6795bc34778465293e45647518906d6/P0.jpg
                      width: 1280
                    sold_price_amount: '50.00'
                    sold_price_currency: GBP
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: >-
            Not Found - no price prediction is available for the given attributes
            (for example, an uncommon brand and product type combination).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                id: "6eaec55a-c500-4c76-81b6-fda44828df1e"
                errors:
                  - code: "price_prediction_not_available"
                    message: "No price prediction is available for the given attributes."
        '422':
          description: Unprocessable Entity - validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                id: "a210923f-c1f3-4d84-a2bd-7f18c68553e2"
                errors:
                  - code: "unsupported_country"
                    message: "Country 'AU' is not supported. Supported countries: GB, US"
