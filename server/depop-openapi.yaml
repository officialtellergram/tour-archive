  /api/v1/products/by-slug/{slug}/:
    get:
      tags:
        - Products - By Slug
      summary: Get product details by slug
      description: >-
        This endpoint allows you to get the details of a product by its slug.

        **Required OAuth Scopes:**
        - `products_read` - Required to access product information
        - `offers_read` - Optional. Required to include offer pricing information (`auto_send_offer_price`, `auto_negotiate_offer_price`) in the response. If this scope is not provided, these fields will be omitted from the response.


        The slug is a URL-friendly identifier for the product and can be obtained from any endpoint that returns product details (e.g. `GET /api/v1/products/by-sku/{sku}/` or create/update responses).
      operationId: getProductBySlug
      parameters:
        - name: slug
          in: path
          description: The slug of the product.
          required: true
          schema:
            type: string
          example: "vintage-nike-t-shirt-7033001"
      responses:
        '200':
          description: A single product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                product_id: 7033001
                slug: "vintage-nike-t-shirt-7033001"
                status: "STATUS_ONSALE"
                address:
                  country_code: "GB"
                  state: "Greater London"
                description: "Vintage Nike T-Shirt in excellent condition.\nBlack with white swoosh logo on the front.\nSize medium, fits true to size.\nSmall mark on the left sleeve (see last image).\n\n#vintage #nike #streetwear #90s"
                price_currency: "GBP"
                price_amount: "25.99"
                current_price: "24.00"
                discount_price: "24.00"
                auto_send_offer_price: "20.00"
                auto_negotiate_offer_price: "20.00"
                national_shipping_cost: "3.50"
                international_shipping_cost: "12.00"
                quantity: 1
                pictures:
                  - url: "https://media-photos-staging.depop.com/b0/18220/5612584_b6795bc34778465293e45647518906d6/P0.jpg"
                    height: 1280
                    width: 1280
                  - url: "https://media-photos-staging.depop.com/b0/18220/5612584_b6795bc34778465293e45647518906d6/P1.jpg"
                    height: 1280
                    width: 1280
                department: "menswear"
                product_type: "tshirts"
                size_set_id: 52
                size_id: 10
                condition: "used_excellent"
                colour:
                  - "black"
                  - "white"
                style:
                  - "streetwear"
                  - "retro"
                  - "sportswear"
                age:
                  - "90s"
                attributes:
                  sleeve-length: [ "short" ]
                  material: [ "cotton" ]
                  occasion: [ "casual" ]
                brand: "nike"
                is_boosted: false
                source:
                  - "vintage"
                  - "preloved"
                created_at: "2024-01-15T10:30:00Z"
                updated_at: "2024-01-15T14:20:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                id: "a210923f-c1f3-4d84-a2bd-7f18c68553e2"
                errors:
                  - code: "product_not_found"
                    message: "Product (slug: vintage-nike-t-shirt-7033001) not found"
    put:
      tags:
        - Products - By Slug
      summary: Update an existing product by slug
      description: >-
        This endpoint allows you to update an existing product on Depop using its slug.
        The product will be updated with the new details in the request.

        **Required OAuth Scopes:**
        - `products_write` - Required for all product operations
        - `offers_write` - Required when setting `auto_send_offer_price` or `auto_negotiate_offer_price`

        **Note:** This endpoint only supports updating existing products. If the slug does not exist, a 404 error will be returned.
        To create a new product, use the POST `/api/v1/products/` or PUT `/api/v1/products/by-sku/{sku}/` endpoint instead.
      operationId: updateProductBySlug
      parameters:
        - name: slug
          in: path
          description: The slug of the product to update.
          required: true
          schema:
            type: string
          example: "vintage-nike-t-shirt-7033001"
      requestBody:
        description: Product details to update
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductPutRequest'
            example:
              address:
                country_code: "GB"
                state: "Greater London"
              description: "Vintage Nike T-Shirt in excellent condition.\nBlack with white swoosh logo on the front.\nSize medium, fits true to size.\nSmall mark on the left sleeve (see last image).\n\n#vintage #nike #streetwear #90s"
              price_currency: "GBP"
              price_amount: "25.99"
              discount_price: "24.00"
              auto_send_offer_price: "20.00"
              auto_negotiate_offer_price: "20.00"
              national_shipping_cost: "3.50"
              international_shipping_cost: "12.00"
              quantity: 1
              pictures:
                - url: "https://images.ctfassets.net/itoh30v6uh9a/3c1QQDGUAEHH9A76ovYSTA/1837e557daee3c763b6fbedd19785094/WW.jpg#type=cover-image"
                - url: "https://images.ctfassets.net/itoh30v6uh9a/3c1QQDGUAEHH9A76ovYSTA/1837e557daee3c763b6fbedd19785094/WW.jpg#type=back"
                - url: "https://images.ctfassets.net/itoh30v6uh9a/3c1QQDGUAEHH9A76ovYSTA/1837e557daee3c763b6fbedd19785094/WW.jpg#type=tag"
              department: "menswear"
              product_type: "tshirts"
              size_set_id: 52
              size_id: 10
              condition: "used_excellent"
              colour:
                - "black"
                - "white"
              style:
                - "streetwear"
                - "retro"
                - "sportswear"
              age:
                - "90s"
              source:
                - "vintage"
                - "preloved"
              brand_name: "Nike"
              attributes:
                sleeve-length: [ "short" ]
                material: [ "cotton" ]
                occasion: [ "casual" ]
              is_boosted: false
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCreateOrUpdateResponse'
              example:
                product_id: 7033001
                slug: "vintage-nike-t-shirt-7033001"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                id: "a210923f-c1f3-4d84-a2bd-7f18c68553e2"
                errors:
                  - code: "product_not_found"
                    message: "Product (slug: vintage-nike-t-shirt-7033001) not found"
    patch:
      tags:
        - Products - By Slug
      summary: Patch an existing product by slug
      description: >-
        This endpoint allows you to patch an `ON SALE` product's fields on Depop using its slug.

        If you want to restock a product, call the PUT endpoint with the same slug with the available quantity.

        **Required OAuth Scopes:**
        - `products_write` - Required for all product operations
        - `offers_write` - Required when setting `auto_send_offer_price` or `auto_negotiate_offer_price`
      operationId: patchProductBySlug
      parameters:
        - name: slug
          in: path
          description: The slug of the product to patch.
          required: true
          schema:
            type: string
          example: "vintage-nike-t-shirt-7033001"
      requestBody:
        description: Product fields to patch on the existing product.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchProductRequest'
            example:
              price_amount: "39.99"
              discount_price: "37.00"
              auto_send_offer_price: "35.00"
              auto_negotiate_offer_price: "35.00"
        required: true
      responses:
        '200':
          description: Successful operation, no content returned.
          content: { }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                id: "a210923f-c1f3-4d84-a2bd-7f18c68553e2"
                errors:
                  - code: "product_not_found"
                    message: "Product (slug: vintage-nike-t-shirt-7033001) not found"
    delete:
      tags:
        - Products - By Slug
      summary: Delete a product by slug
      description: >-
        This endpoint allows you to delete a product on Depop using its slug.
        The product will no longer be available for sale and will be removed from your shop.
        This endpoint is idempotent - it will return a successful response (200) even if the product doesn't exist.

        **Required OAuth Scope:** `products_write`
      operationId: deleteProductBySlug
      parameters:
        - name: slug
          in: path
          description: The slug of the product to delete.
          required: true
          schema:
            type: string
          example: "vintage-nike-t-shirt-7033001"
        - name: fail_if_active_offers
          in: query
          description: >-
            If set to `true`, the delete will fail with a 409 Conflict error if the product has any active offers.
            If set to `false` or omitted, the product will be deleted regardless of active offers.


            **Note:** This is a temporary flag until insights are available to help you manage active offers.
            If you plan to use this feature, please let us know so we can understand your use case and ensure a smooth transition
            when insights become available.
          required: false
          schema:
            type: boolean
            default: false
          example: true
      responses:
        '200':
          description: Successful operation, no content returned.
          content: { }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Conflict - Product has active offers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                id: "a210923f-c1f3-4d84-a2bd-7f18c68553e2"
                errors:
                  - code: "product_has_active_offers"
                    message: "Product has active offers and cannot be deleted."
