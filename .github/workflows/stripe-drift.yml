name: Stripe price drift

# A Stripe Price is immutable: repricing in the Dashboard makes a new price and
# archives the old one, and every Payment Link stays bound to the old price, so
# the buy button dies (1 Oct 2026: 31 of them). This job notices and repairs it:
# a new link on the product's current price, the manifest updated, the site
# redeployed through the normal gated workflow.
#
# Lightweight on purpose: no npm install (the script is Node built-ins + fetch),
# a no-op commit-wise when nothing drifted, and silent until the secret exists.
#
# The same run marks sold pieces (scripts/stripe-sold.mjs) before it repairs
# drift, so a sale shows as sold on the site within the hour.
#
# Needs one repository secret, STRIPE_DRIFT_KEY: a RESTRICTED live key with
# Products write, Prices read, Payment Links write, Checkout Sessions read,
# everything else None.

on:
  schedule:
    # Every ten minutes, off the round numbers. The job is ~15 s and commits
    # only when something sold or drifted. Stripe itself closes a sold link
    # the instant it is paid (one completed session per link), so this
    # interval is only how long the site can still SHOW a sold piece as
    # available; it can never sell twice. GitHub may run schedules a few
    # minutes late under load.
    - cron: '7-57/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write # commit the repaired manifest
  actions: write # start the deploy (a push by this token does not trigger it)

concurrency:
  group: stripe-drift
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_DRIFT_KEY }}
    steps:
      - name: Skip until the key is set
        id: key
        run: |
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "STRIPE_DRIFT_KEY is not set; nothing to do." >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 22

      # A paid Checkout Session against a piece's link IS the sale. The sweep
      # marks the piece sold, takes its checkout off the record and closes the
      # link. Needs Checkout Sessions: Read on the key; without it this step
      # reports the refusal and the drift repair below still runs.
      - name: Mark sold pieces
        if: steps.key.outputs.present == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/stripe-sold.mjs | tee sold.log
          {
            echo '### Stripe sold sweep'
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' sold.log | tail -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f sold.log

      # eBay, both directions: an eBay sale marks the piece sold here and
      # closes its Stripe link; a piece sold here ends its eBay listing; eBay
      # prices follow the catalogue. Tokens come from the Worker's broker.
      - name: Sync eBay
        if: steps.key.outputs.present == 'true'
        continue-on-error: true
        env:
          EBAY_SYNC_SECRET: ${{ secrets.EBAY_SYNC_SECRET }}
          # Repository variables (Settings → Secrets and variables → Variables):
          # the eBay price above the site's (0.10 = +10 %), the days a drop
          # stays site-only, and the switch that lets the job create listings.
          EBAY_PRICE_MARKUP: ${{ vars.EBAY_PRICE_MARKUP }}
          EBAY_DROP_DELAY_DAYS: ${{ vars.EBAY_DROP_DELAY_DAYS }}
          EBAY_LISTING_ENABLED: ${{ vars.EBAY_LISTING_ENABLED }}
        run: |
          set -o pipefail
          node scripts/ebay-sync.mjs --write | tee ebay.log
          {
            echo '### eBay sync'
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' ebay.log | tail -24
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f ebay.log

      - name: Repair drifted links
        if: steps.key.outputs.present == 'true'
        run: |
          set -o pipefail
          node scripts/stripe-drift.mjs --write --live | tee drift.log
          {
            echo '### Stripe drift'
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' drift.log | tail -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f drift.log

      - name: Publish if anything changed
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- public/stock/manifest.json; then
            echo "Manifest unchanged; nothing to publish."
            exit 0
          fi
          git config user.name "tour-archive-drift"
          git config user.email "actions@users.noreply.github.com"
          git add public/stock/manifest.json
          git commit -m "Stripe sync: sold pieces marked, drifted links re-minted" \
                     -m "Automatic (stripe-drift.yml). Either a piece sold (marked sold, checkout removed, link closed) or a price was changed in the Stripe Dashboard (the link bound to the archived price replaced, the site's price updated). The run summary says which."
          git pull --rebase origin main
          git push origin HEAD:main
          # A push made with the workflow token does not start other workflows;
          # a manual dispatch does. The deploy runs its usual gates.
          gh workflow run "Deploy to GitHub Pages" --ref main
