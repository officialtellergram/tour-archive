name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Stock is a build-time snapshot, so rebuilding is how it refreshes.
  # 07:20 UTC daily — an off-the-hour minute, to avoid the crowd on :00.
  schedule:
    - cron: '20 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The site checks before it ships. These need no browser and no network.
      - name: Verify
        run: npm run check

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build
        env:
          # A project site is served from /<repo>/; a user or org site from /.
          # configure-pages resolves which, so the base is never hand-maintained.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Live channels — set these as repository secrets when ready.
          EBAY_ENABLED: ${{ secrets.EBAY_ENABLED }}
          EBAY_ENV: ${{ secrets.EBAY_ENV }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_SELLER_USERNAME: ${{ secrets.EBAY_SELLER_USERNAME }}
          DEPOP_ENABLED: ${{ secrets.DEPOP_ENABLED }}
          DEPOP_API_KEY: ${{ secrets.DEPOP_API_KEY }}
          DEPOP_SHOP_ID: ${{ secrets.DEPOP_SHOP_ID }}
        run: npm run build:pages

      - name: Check the deploy is sane
        run: node scripts/deploy.mjs

      # DIAGNOSTIC (temporary): can a runner read the eBay seller index? If
      # yes, sold-sync can run at build time daily with no local task and no
      # auto-commits. Result ships as dist/api/ebay-probe.json; never fatal.
      - name: eBay index reachability probe
        if: ${{ always() }}
        run: |
          code=$(curl -s -o /tmp/mhtml.html -w '%{http_code}' --max-time 25 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36 Edg/140.0.0.0' \
            'https://www.ebay.com/sch/tourarchive/m.html' || echo 000)
          rows=$(grep -o 's-item__title\|s-card__title' /tmp/mhtml.html | wc -l)
          title=$(grep -o '<title>[^<]*' /tmp/mhtml.html | head -1 | sed 's/<title>//')
          echo "{\"http\":$code,\"rows\":$rows,\"title\":\"${title//\"/}\",\"at\":\"$(date -u +%FT%TZ)\"}" > dist/api/ebay-probe.json
          cat dist/api/ebay-probe.json

      # Live-motion reveal gate: drives headless Chrome at 390x844 against the
      # BUILT site and fails if any scroll-revealed content never reveals. The
      # layout gate freezes animations so it cannot see this class; the bug is
      # growth-triggered (fine at 14 pieces, broken at 27 — 20 Aug 2026), so
      # the daily rebuild re-proves it as stock grows, not just on code change.
      - name: Reveal gate (390x844, animations live)
        run: npm run reveal

      # Supabase free projects pause after ~7 idle days of DATABASE activity —
      # so the ping must run a real query (PostgREST as anon; RLS returns []
      # but Postgres still executes it). /auth/v1/health would answer from
      # memory and keep nothing alive. Runs even when the build is red
      # (a week of red builds must not also pause the database), never fails
      # the job, and no-ops until the repo variables are set (ACTIONS.md § 0).
      - name: Keep Supabase awake
        if: ${{ always() && vars.SUPABASE_URL != '' && vars.SUPABASE_ANON_KEY != '' }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          curl -sf --max-time 20 "$SUPABASE_URL/rest/v1/curation_finds?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -o /dev/null \
            && echo "supabase awake" || echo "supabase ping failed (non-fatal)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
