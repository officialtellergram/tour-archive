name: Sales report

# The sales report (scripts/sales-report.mjs) into the team's Google Drive
# folder, with no PC involved. The Cloudflare Worker's cron starts this job
# (worker/stripe-hook: Mondays for the all-time report, the 1st for last
# month's statement); it can also be started by hand with a month. The CSV
# is handed to the Worker's report store, and the Apps Script in the team's
# Drive files it within the hour.
#
# Secrets: STRIPE_DRIFT_KEY (Checkout Sessions, Payment Intents, Charges and
# Balance transactions: read, for the Stripe rows' fee and net), EBAY_SYNC_SECRET
# (the Worker's eBay token broker), REPORT_SECRET (the report store),
# SALE_MAIL_* for the failure alert. Variables: SALE_EMAILS.

on:
  workflow_dispatch:
    inputs:
      period:
        description: '"week" = last Monday–Sunday (plus a refresh of the all-time file); "month" = last month; YYYY-MM = that month; a date = its Monday–Sunday week; empty = the all-time report only'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: sales-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the report
        id: report
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_DRIFT_KEY }}
          EBAY_SYNC_SECRET: ${{ secrets.EBAY_SYNC_SECRET }}
          PERIOD: ${{ inputs.period }}
        run: |
          set -o pipefail
          mkdir -p out
          # The period words resolve here so the file name in Drive is known:
          #   month → YYYY-MM of the month just ended
          #   week  → the Monday of the week just ended (Monday–Sunday)
          #   a date → the Monday of its week
          case "$PERIOD" in
            month) ARG="--month=$(date -u -d "$(date -u +%Y-%m-01) -1 month" +%Y-%m)"; NAME="sales-report-${ARG#--month=}.csv" ;;
            week)  MON=$(date -u -d "$(date -u +%Y-%m-%d) -$(( ($(date -u +%u) - 1) % 7 + 7 )) days" +%Y-%m-%d); ARG="--week=$MON"; NAME="sales-report-week-$MON.csv" ;;
            ????-??)    ARG="--month=$PERIOD"; NAME="sales-report-$PERIOD.csv" ;;
            ????-??-??) MON=$(date -u -d "$PERIOD -$(( ($(date -u -d "$PERIOD" +%u) - 1) % 7 )) days" +%Y-%m-%d); ARG="--week=$MON"; NAME="sales-report-week-$MON.csv" ;;
            "")    ARG=""; NAME="sales-report.csv" ;;
            *)     echo "period must be week, month, YYYY-MM, YYYY-MM-DD or empty"; exit 1 ;;
          esac
          node scripts/sales-report.mjs out/report.csv $ARG | tee report.log
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          {
            echo "### Sales report → $NAME"
            echo '```'
            tail -30 report.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # The Monday run also refreshes the all-time file.
          if [ "$PERIOD" = "week" ]; then
            node scripts/sales-report.mjs out/all-time.csv | tail -3
            echo "alltime=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep a copy with the run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.report.outputs.name }}
          path: out/*.csv
          retention-days: 90

      # The Apps Script in the team's Drive collects it from the Worker within
      # the hour and files it in Transaction Invoices.
      - name: Hand it to the Worker for Drive
        env:
          REPORT_SECRET: ${{ secrets.REPORT_SECRET }}
        run: |
          node scripts/report-publish.mjs out/report.csv "${{ steps.report.outputs.name }}"
          if [ "${{ steps.report.outputs.alltime }}" = "true" ]; then
            node scripts/report-publish.mjs out/all-time.csv sales-report.csv
          fi

      - name: Tell the team the report failed
        if: failure()
        env:
          SALE_MAIL_USER: ${{ secrets.SALE_MAIL_USER }}
          SALE_MAIL_PASS: ${{ secrets.SALE_MAIL_PASS }}
          SALE_EMAILS: ${{ vars.SALE_EMAILS }}
        run: node scripts/notify-failure.mjs
